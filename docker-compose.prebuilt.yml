version: '3.8'

services:
  # Backend Service (Python FastAPI) - BUILD di Portainer
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: 3d-farm-backend
    restart: unless-stopped
    ports:
      - "5051:5051"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - BAMBU_PRINTER_IP=${BAMBU_PRINTER_IP:-}
      - BAMBU_PRINTER_ID=${BAMBU_PRINTER_ID:-}
      - BAMBU_ACCESS_CODE=${BAMBU_ACCESS_CODE:-}
    networks:
      - printfarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5051/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service - PULL pre-built image dari GHCR
  frontend:
    image: ghcr.io/kevinwiliamleo-dev/3d-farm-frontend:latest
    container_name: 3d-farm-frontend
    restart: unless-stopped
    ports:
      - "3051:3051"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5051
      - PORT=3051
    networks:
      - printfarm-network
    depends_on:
      backend:
        condition: service_healthy

  # Watchtower - Auto update containers
  watchtower:
    image: containrrr/watchtower
    container_name: 3d-farm-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    networks:
      - printfarm-network

networks:
  printfarm-network:
    driver: bridge

volumes:
  data:
  logs:
