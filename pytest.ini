[pytest]
# Pytest configuration for 3D Print Farm

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --color=yes

# Test paths
testpaths = tests

# Coverage options
# Requires: pip install pytest-cov
# addopts = --cov=src --cov-report=html

# Asyncio options (if using async tests)
# asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    mqtt: Tests requiring MQTT
