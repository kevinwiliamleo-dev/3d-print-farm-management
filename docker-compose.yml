version: '3.8'

services:
  # Backend Service (Python FastAPI) - Pull from GHCR
  backend:
    image: ghcr.io/kevinwiliamleo-dev/3d-print-farm-management-backend:development
    container_name: 3d-farm-backend
    restart: unless-stopped
    ports:
      - "5051:5051"
    volumes:
      # Mount data/logs only, NOT source code (causes import errors in production)
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Printer data diambil dari database, tidak perlu env vars
      # Hanya diperlukan jika belum ada printer di database (first run)
      - BAMBU_PRINTER_IP=${BAMBU_PRINTER_IP:-192.168.4.101}
      - BAMBU_PRINTER_ID=${BAMBU_PRINTER_ID:-03900D5A2402051}
      - BAMBU_ACCESS_CODE=${BAMBU_ACCESS_CODE:-}
      - BAMBU_SERIAL=${BAMBU_SERIAL:-03900D5A2402051}
    networks:
      - printfarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5051/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (React) - Pull from GHCR
  frontend:
    image: ghcr.io/kevinwiliamleo-dev/3d-print-farm-management-frontend:development
    container_name: 3d-farm-frontend
    restart: unless-stopped
    ports:
      - "3051:3051"
    volumes:
      # Persist node_modules only (source code baked into image)
      - node_modules:/app/node_modules
    environment:
      - PORT=3051
      # Auto-detect backend URL (empty = use window.location with port 5051)
      - REACT_APP_BACKEND_URL=
      - CHOKIDAR_USEPOLLING=true  # Enable hot reload in Docker
    networks:
      - printfarm-network
    depends_on:
      - backend

  # NOTE: Watchtower dihapus - deploy dilakukan manual via deploy.bat (Portainer API)
  # Lihat deploy.bat / deploy.ps1 untuk cara deploy kode terbaru ke server

networks:
  printfarm-network:
    driver: bridge
    # Jika mau connect ke portainer_network yang existing, ganti dengan:
    # external: true
    # name: portainer_network

volumes:
  node_modules:
